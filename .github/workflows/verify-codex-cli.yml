name: Codex CLI Windows detection regression

on:
  pull_request:
    paths:
      - 'cli/src/detect.ts'
      - 'cli/src/detect.test.ts'
      - '.github/workflows/verify-codex-cli.yml'
  push:
    branches: [main]
    paths:
      - 'cli/src/detect.ts'
      - 'cli/src/detect.test.ts'
      - '.github/workflows/verify-codex-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-and-linux-cli:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Validate Codex CLI detection and Windows PATH handling
        run: npm run test -w cli -- src/detect.test.ts
      - name: Build CLI TypeScript
        run: npm run build -w cli
